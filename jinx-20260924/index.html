<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JINX — two worlds, one button</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚡</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0b0a12;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:relative}
canvas{display:block;background:#0b0a12;touch-action:none}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8f8aa8;font-size:13px;pointer-events:none;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="hint">TAP = JUMP BOTH WORLDS</div>
</div>
<script>
'use strict';
// ===== JINX: one tap jumps both worlds. Spikes: must jump. Crystal bands: must NOT jump. =====
const W=480,H=800;
const TOP={y0:96,y1:392};      // top world band
const BOT={y0:432,y1:728};     // bottom world band
const GROUND_T=TOP.y1, GROUND_B=BOT.y1;
const PX=118;                  // runner x
const R=15;                    // runner radius
const GRAV=1400, JUMPV=-520;   // airtime ~0.74s, apex ~96px
const SPIKE_H=40;
const cv=document.getElementById('cv'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();

let state='menu', score=0, best=+(localStorage.getItem('jinx_best')||0);
let tRun=0, dist=0, shake=0, flash=0, overAt=0, slowmo=0;
let nextEvT=1.6, lastJumpT={T:-9,B:-9}, lastSpikeT={T:-9,B:-9}, lastBandT=-99;
let gems=0, syncCount=0;
const spikes=[],bands=[],parts=[],pops=[];
const P={ // two runners, shared vertical logic per world
 T:{y:GROUND_T-R,vy:0,ground:true},
 B:{y:GROUND_B-R,vy:0,ground:true}
};
const spd=()=>260+14*Math.sqrt(tRun);        // px/s
const minGap=()=>Math.max(0.85,1.18-tRun*0.004); // event spacing shrinks 1.18s -> 0.85s

function reset(){
  state='play';score=0;tRun=0;dist=0;shake=0;flash=0;slowmo=0;
  nextEvT=1.6;lastJumpT={T:-9,B:-9};lastSpikeT={T:-9,B:-9};lastBandT=-99;
  gems=0;syncCount=0;
  spikes.length=0;bands.length=0;parts.length=0;pops.length=0;
  P.T.y=GROUND_T-R;P.T.vy=0;P.T.ground=true;
  P.B.y=GROUND_B-R;P.B.vy=0;P.B.ground=true;
  document.getElementById('hint').style.display='none';
}
function die(cause){
  if(state!=='play')return;
  state='over';overAt=performance.now();shake=16;slowmo=0.5;
  if(causes[cause])causes[cause]++;else causes[cause]=1;
  if(score>best){best=score;localStorage.setItem('jinx_best',best);}
  sfx('die');
}
let causes={}; // telemetry
// audio
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function sfx(kind){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),gn=a.createGain();o.connect(gn);gn.connect(a.destination);
  if(kind==='jump'){o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(520,t+0.08);gn.gain.setValueAtTime(0.08,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.start(t);o.stop(t+0.13);}
  else if(kind==='gem'){o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1320,t+0.09);gn.gain.setValueAtTime(0.12,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.start(t);o.stop(t+0.15);}
  else if(kind==='sync'){o.type='triangle';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(784,t+0.06);gn.gain.setValueAtTime(0.14,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.start(t);o.stop(t+0.26);}
  else if(kind==='die'){o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(40,t+0.4);gn.gain.setValueAtTime(0.18,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.45);o.start(t);o.stop(t+0.46);}
}
// ---- scheduler: emits spike events on a shared timeline ----
// types: T spike top only, B spike bottom only, S sync (both), U band top, D band bottom
function emitSpikes(w,t){ // w='T'|'B', spawn spikes at x offscreen right
  const gY=(w==='T')?GROUND_T:GROUND_B;
  const n=1+(Math.random()<0.35?1:0);
  const x0=W+(nextEvT-tRun)*spd();
  for(let i=0;i<n;i++){
    spikes.push({w,x:x0+i*46,h:SPIKE_H*(0.85+Math.random()*0.3),seed:Math.random()*7});
  }
  lastSpikeT[w]=nextEvT;
}
function emitBand(w){
  const x0=W+(nextEvT-tRun)*spd();
  bands.push({w,x:x0,len:120+Math.random()*50,bot:(w==='T'?TOP.y0:BOT.y0)+195}); // hangs into jump-apex zone (apex topY = ground-126)
  lastBandT=nextEvT;
}
function schedule(){
  const horizon=tRun+2.6;
  while(nextEvT<horizon){
    const mg=minGap();
    // choose type: sync p=0.18, band p (after 14s) up to 0.2, else split T/B with per-world spacing check
    let type;
    const r=Math.random();
    const bandP=tRun<14?0:Math.min(0.2,0.06+tRun*0.002);
    if(r<0.18)type='S';
    else if(r<0.18+bandP)type=Math.random()<0.5?'U':'D';
    else type=Math.random()<0.5?'T':'B';
    const worlds=(type==='S')?['T','B']:(type==='T'||type==='U')?['T']:['B'];
    if(type!=='S'&&type!=='U'&&type!=='D'){/*unreachable*/}
    if(type==='T'&&nextEvT-lastSpikeT.T<mg)type='B';
    else if(type==='B'&&nextEvT-lastSpikeT.B<mg)type='T';
    if(type==='S'&&(nextEvT-lastSpikeT.T<mg||nextEvT-lastSpikeT.B<mg)){type=Math.random()<0.5?'T':'B';if(type==='T'&&nextEvT-lastSpikeT.T<mg)type='B';}
    if(type==='U'&&(nextEvT-lastSpikeT.T<mg+0.3||nextEvT-lastSpikeT.B<0.75))type='D';
    if(type==='D'&&(nextEvT-lastSpikeT.B<mg+0.3||nextEvT-lastSpikeT.T<0.75))type='U';
    if(type==='U'&&(nextEvT-lastSpikeT.T<mg+0.3||nextEvT-lastSpikeT.B<0.75))type='T'; // fall back to spike
    if(type==='D'&&(nextEvT-lastSpikeT.B<mg+0.3||nextEvT-lastSpikeT.T<0.75))type='B';
    if(type==='U'||type==='D'){emitBand(type==='U'?'T':'B');}
    else if(type==='S'){
      emitSpikes('T',nextEvT);emitSpikes('B',nextEvT);syncCount++;
      pops.push({x:W/2,y:H/2,txt:'SYNC +25',t:0,col:'#fff'});
      score+=25;sfx('sync');flash=0.35;
    } else {
      emitSpikes(type,nextEvT);
      if(Math.random()<0.6){ // gem arc above the spikes
        const gY=(type==='T')?GROUND_T:GROUND_B;
        parts.push({gem:1,w:type,x:W+90,y:gY-86,vx:0,vy:0,life:99,t:0});
      }
    }
    nextEvT+=mg+Math.random()*0.55;
  }
}
function jump(){
  let did=false;
  for(const k of ['T','B']){const p=P[k];
    if(p.ground){p.vy=JUMPV;p.ground=false;did=true;lastJumpT[k]=tRun;
      for(let i=0;i<6;i++)parts.push({x:PX,y:p.y+R,vx:(Math.random()-0.5)*120,vy:Math.random()*60,life:0.35,t:0,col:'#6b6590'});
    }}
  if(did)sfx('jump');
}
// ---- physics + collide ----
function update(dt){
  if(state!=='play')return;
  tRun+=dt;dist+=spd()*dt;
  score=Math.floor(dist/12)+gems*5;
  const v=spd();
  schedule();
  for(const k of ['T','B']){const p=P[k],gY=(k==='T')?GROUND_T:GROUND_B;
    if(!p.ground){p.vy+=GRAV*dt;p.y+=p.vy*dt;
      if(p.y>=gY-R){p.y=gY-R;p.vy=0;p.ground=true;
        for(let i=0;i<4;i++)parts.push({x:PX+(Math.random()-0.5)*16,y:gY,vx:(Math.random()-0.5)*90,vy:-Math.random()*50,life:0.3,t:0,col:'#575170'});}
    }}
  const dx=v*dt;
  for(let i=spikes.length-1;i>=0;i--){const s=spikes[i];s.x-=dx;
    if(s.x<-80){spikes.splice(i,1);continue;}
    if(s.x>PX-34&&s.x<PX+30&&Math.abs((s.w==='T'?GROUND_T:GROUND_B)-P[s.w].y-R)<s.h-4)die('spike');
  }
  for(let i=bands.length-1;i>=0;i--){const b=bands[i];b.x-=dx;
    if(b.x+b.len<-40){bands.splice(i,1);continue;}
    const p=P[b.w],gY=(b.w==='T')?GROUND_T:GROUND_B,topY=p.y-R;
    if(!p.ground&&topY<b.bot+4&&b.x<PX+R&&b.x+b.len>PX-R)die('crystal');
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];
    if(q.gem){q.x-=dx;if(q.x<-30){parts.splice(i,1);continue;}
      if(Math.abs(q.x-PX)<26&&Math.abs(q.y-(P[q.w].y))<34){parts.splice(i,1);gems++;sfx('gem');flash=Math.max(flash,0.12);
        for(let j=0;j<8;j++)parts.push({x:q.x,y:q.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,life:0.4,t:0,col:'#ffd76b'});}
    } else {q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;if(q.t>q.life)parts.splice(i,1);}
  }
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>0.9)pops.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*40);
  if(flash>0)flash=Math.max(0,flash-dt*1.6);
}
// ---- render ----
function render(){
  g.save();
  if(shake>0)g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  g.fillStyle='#0b0a12';g.fillRect(-20,-20,W+40,H+40);
  // world backdrops
  const grd1=g.createLinearGradient(0,TOP.y0,0,TOP.y1);grd1.addColorStop(0,'#241a10');grd1.addColorStop(1,'#171009');
  g.fillStyle=grd1;g.fillRect(0,TOP.y0,W,TOP.y1-TOP.y0);
  const grd2=g.createLinearGradient(0,BOT.y0,0,BOT.y1);grd2.addColorStop(0,'#08131c');grd2.addColorStop(1,'#0c1a26');
  g.fillStyle=grd2;g.fillRect(0,BOT.y0,W,BOT.y1-BOT.y0);
  // ground lines
  g.fillStyle='#3d2f1c';g.fillRect(0,GROUND_T,W,3);
  g.fillStyle='#1d3a4d';g.fillRect(0,GROUND_B,W,3);
  // distance ticks (speed feel)
  g.strokeStyle='#221d38';g.lineWidth=2;
  for(let k=0;k<12;k++){const tx=((k*160-dist)%(W+160)+W+160)%(W+160)-80;
    g.beginPath();g.moveTo(tx,GROUND_T-14);g.lineTo(tx-24,GROUND_T);g.stroke();
    g.beginPath();g.moveTo(tx,BOT.y0+14);g.lineTo(tx-24,BOT.y0);g.stroke();}
  // spikes
  for(const s of spikes){const gY=(s.w==='T')?GROUND_T:GROUND_B;
    g.fillStyle=s.w==='T'?'#ffb347':'#53d7e8';
    g.beginPath();g.moveTo(s.x,gY);g.lineTo(s.x+18,gY-s.h);g.lineTo(s.x+36,gY);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,0.25)';g.beginPath();g.moveTo(s.x+12,gY);g.lineTo(s.x+18,gY-s.h);g.lineTo(s.x+20,gY);g.closePath();g.fill();}
  // crystal bands (do NOT jump)
  for(const b of bands){const y0=(b.w==='T')?TOP.y0:BOT.y0;
    const n=Math.floor(b.len/22);
    for(let i=0;i<=n;i++){const cx=b.x+i*(b.len/n),hh=(b.bot-y0)*(0.75+0.25*Math.sin(cx*0.07+b.w.charCodeAt(0)));
      g.fillStyle=b.w==='T'?'#c95d8f':'#7f6bd8';
      g.beginPath();g.moveTo(cx-9,y0);g.lineTo(cx,y0+hh);g.lineTo(cx+9,y0);g.closePath();g.fill();}
    g.fillStyle='rgba(201,93,143,0.12)';g.fillRect(b.x,y0,b.len,b.bot-y0);
  }
  // gems
  for(const q of parts){if(!q.gem)continue;
    const bob=Math.sin(tRun*6+q.x*0.05)*4;
    g.fillStyle='#ffd76b';g.save();g.translate(q.x,q.y+bob);g.rotate(Math.PI/4);g.fillRect(-7,-7,14,14);
    g.fillStyle='#fff3c9';g.fillRect(-3,-3,6,6);g.restore();}
  // runners: top=amber, bottom=cyan
  drawRunner(P.T.y,'#ffb347','#ffd76b',-1);
  drawRunner(P.B.y,'#53d7e8','#a8f0fa',1);
  // particles
  for(const q of parts){if(q.gem)continue;const a=1-q.t/q.life;
    g.globalAlpha=a;g.fillStyle=q.col;g.fillRect(q.x-2,q.y-2,4,4);}
  g.globalAlpha=1;
  // sync pop text
  for(const p of pops){g.globalAlpha=1-p.t/0.9;g.fillStyle=p.col;g.font='bold 22px Segoe UI';
    g.textAlign='center';g.fillText(p.txt,p.x,p.y-p.t*40);}
  g.globalAlpha=1;
  // HUD
  g.textAlign='left';g.fillStyle='#8f8aa8';g.font='12px Segoe UI';
  g.fillText('SCORE',20,36);g.fillText('BEST',W-110,36);
  g.fillStyle='#fff';g.font='bold 26px Segoe UI';g.fillText(score,20,64);
  g.fillStyle='#ffd76b';g.fillText(best,W-110,64);
  g.textAlign='center';g.fillStyle='#5c5680';g.font='11px Segoe UI';
  g.fillText('▲ TOP WORLD',W/2,TOP.y0-42);g.fillText('▼ BOTTOM WORLD',W/2,BOT.y1+26);
  if(state==='menu'){
    g.fillStyle='rgba(11,10,18,0.72)';g.fillRect(0,0,W,H);
    g.textAlign='center';
    g.fillStyle='#fff';g.font='bold 54px Segoe UI';g.fillText('JINX',W/2,330);
    g.fillStyle='#ffb347';g.font='bold 16px Segoe UI';g.fillText('▲ one world above',W/2,372);
    g.fillStyle='#53d7e8';g.fillText('▼ one world below',W/2,398);
    g.fillStyle='#c9c4e0';g.font='15px Segoe UI';
    g.fillText('ONE tap jumps BOTH runners.',W/2,452);
    g.fillText('Jump over spikes. NEVER jump under crystals.',W/2,478);
    g.fillStyle='#fff';g.font='bold 20px Segoe UI';
    g.globalAlpha=0.6+0.4*Math.sin(performance.now()/300);
    g.fillText('TAP TO START',W/2,560);g.globalAlpha=1;
  }
  if(state==='over'){
    g.fillStyle='rgba(11,10,18,0.78)';g.fillRect(0,0,W,H);
    g.textAlign='center';
    g.fillStyle='#ff5f7a';g.font='bold 44px Segoe UI';g.fillText('JINXED!',W/2,330);
    g.fillStyle='#fff';g.font='bold 30px Segoe UI';g.fillText('SCORE '+score,W/2,392);
    if(score>=best&&score>0){g.fillStyle='#ffd76b';g.font='bold 18px Segoe UI';g.fillText('★ NEW BEST ★',W/2,424);}
    else{g.fillStyle='#8f8aa8';g.font='16px Segoe UI';g.fillText('best '+best,W/2,424);}
    g.fillStyle='#c9c4e0';g.font='15px Segoe UI';
    g.fillText('gems '+gems+' · syncs '+syncCount,W/2,456);
    g.fillStyle='#fff';g.font='bold 20px Segoe UI';
    g.globalAlpha=0.6+0.4*Math.sin(performance.now()/300);
    g.fillText('TAP TO RETRY',W/2,540);g.globalAlpha=1;
  }
  if(flash>0){g.fillStyle='rgba(255,255,255,'+(flash*0.25)+')';g.fillRect(-20,-20,W+40,H+40);}
  g.restore();
}
function drawRunner(cy,cMain,cLite,dir){
  const gY=(dir<0)?GROUND_T:GROUND_B;const y=cy; // center
  // trail
  g.strokeStyle=cMain;g.globalAlpha=0.35;g.lineWidth=3;
  g.beginPath();g.moveTo(PX-22,y+dir*2);g.lineTo(PX-10,y);g.stroke();g.globalAlpha=1;
  // body
  g.fillStyle=cMain;g.beginPath();g.arc(PX,y,R,0,7);g.fill();
  g.fillStyle=cLite;g.beginPath();g.arc(PX-4*dir,y-3,5.5,0,7);g.fill();
  // eyes
  g.fillStyle='#0b0a12';g.beginPath();g.arc(PX+5,y-3,2.4,0,7);g.fill();
  g.beginPath();g.arc(PX+10,y-1,2.4,0,7);g.fill();
}
// ---- input ----
function tap(){
  ac();
  if(state==='menu'){reset();return;}
  if(state==='play'){jump();return;}
  if(state==='over'&&performance.now()-overAt>400){reset();return;}
}
addEventListener('pointerdown',e=>{e.preventDefault();tap();},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tap();}});
// ---- loop ----
let last=0;
function loop(now){
  requestAnimationFrame(loop);
  try{
    const dt=Math.min(0.033,(now-last)/1000||0.016);last=now;
    if(slowmo>0){slowmo-=dt;}
    update(state==='over'?dt*0.25:dt); // brief slow-mo on death frame
    render();
  }catch(err){window.__err=String(err&&err.stack||err);}
}
requestAnimationFrame(loop);
// ---- autotest bot ----
if(location.search.includes('autotest')){
  requestAnimationFrame=nop=>{}; // freeze rAF; drive via setInterval below
  window.JINX={get state(){return state;},get score(){return score;},get t(){return tRun;},
    get causes(){return causes;},get gems(){return gems;},spikes,bands,P,tap};
  let deaths=0,prevBest=best;
  setInterval(()=>{ // physics driver
    try{const dt=0.016;update(dt);render();}catch(err){window.__err=String(err&&err.stack||err);}
  },16);
  setInterval(()=>{ // bot brain, tick 50ms
    try{
      if(window.__err)return;
      if(state==='menu'){tap();return;}
      if(state==='over'){if(performance.now()-overAt>400)tap();return;}
      const v=spd();
      // next spike ETA per world
      const eta={T:99,B:99};
      for(const s of spikes){const e=(s.x-PX)/v;if(e<eta[s.w])eta[s.w]=e;}
      let want=-1;
      const aT=eta.T-0.32,aB=eta.B-0.32; // desired jump moments
      const needT=eta.T<99&&eta.T<1.2, needB=eta.B<99&&eta.B<1.2;
      if(needT&&needB)want=Math.min(aT,aB);
      else if(needT)want=aT; else if(needB)want=aB;
      if(want>=-0.02&&want<=0.06){ // time to jump
        if(Math.random()<0.96)tap(); // 4% human miss
      }
    }catch(err){window.__err=String(err&&err.stack||err);}
  },50);
  setInterval(()=>{document.title='st='+state+' sc='+score+' t='+tRun.toFixed(1)+' gems='+gems+' d='+deaths+' ljT='+(tRun-lastJumpT.T).toFixed(2)+','+(tRun-lastJumpT.B).toFixed(2)+' gr='+P.T.ground+P.B.ground+' eta='+Math.min(...spikes.map(s=>(s.x-PX)/spd()),99).toFixed(2);},200);
  // count deaths via state transition
  let wasOver=false;
  setInterval(()=>{if(state==='over'&&!wasOver){deaths++;}wasOver=(state==='over');},30);
  window.JINX.deaths=()=>deaths;
}
</script>
</body>
</html>
