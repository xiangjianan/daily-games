<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GRAZER — skim bullets, don't touch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23ffd23f'/></svg>">
<style>
html,body{margin:0;padding:0;background:#07080f;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{display:block;margin:0 auto;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;color:#3a4160;font:11px monospace;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">GRAZER — drag anywhere · graze bullets for bonus · touch = death</div>
<script>
"use strict";
// ============ GRAZER #15 — 1:1 drag control, graze-risk scoring ============
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=480,H=800;let DPR=1;
function fit(){DPR=Math.min(window.devicePixelRatio||1,2);cv.width=W*DPR;cv.height=H*DPR;
 cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

const GRAZE_R=46,HIT_R=11;
const G={state:'menu',t:0,score:0,best:+(localStorage.getItem('grazer_best')||0),
 grazes:0,combo:0,comboAt:0,mult:1,od:0,odCount:0,run:0,
 px:W/2,py:H*0.7,tx:W/2,ty:H*0.7,vx:0,vy:0,
 bullets:[],parts:[],rings:[],flashes:[],spawnT:0,patternT:0,ptn:0,
 deaths:{},hist:[]};

function reset(){G.state='play';G.t=0;G.score=0;G.grazes=0;G.combo=0;G.mult=1;G.od=0;G.odCount=0;
 G.px=G.tx=W/2;G.py=G.ty=H*0.7;G.bullets.length=0;G.parts.length=0;G.rings.length=0;G.flashes.length=0;
 G.spawnT=0.4;G.patternT=0;G.run++;}

function die(cause){G.deaths[cause]=(G.deaths[cause]||0)+1;
 if(G.score>G.best){G.best=G.score;localStorage.setItem('grazer_best',G.best);}
 G.state='over';G.overAt=performance.now();
 burst(G.px,G.py,26,'#ff4d6d');G.flashes.push({a:0.85});shake=14;sfx('die');}

// ---------- input: 1:1 drag ----------
function toXY(e){const r=cv.getBoundingClientRect();
 const p=e.touches?e.touches[0]||e.changedTouches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};}
function press(e){e.preventDefault();const q=toXY(e);
 if(G.state==='menu'){reset();return;}
 if(G.state==='over'){if(performance.now()-G.overAt>350)reset();return;}
 G.tx=q.x;G.ty=q.y;}
function drag(e){if(G.state!=='play')return;e.preventDefault();const q=toXY(e);G.tx=q.x;G.ty=q.y;}
cv.addEventListener('mousedown',press);cv.addEventListener('mousemove',drag);
addEventListener('mouseup',()=>{});
cv.addEventListener('touchstart',press,{passive:false});
cv.addEventListener('touchmove',drag,{passive:false});

// ---------- spawn patterns ----------
function ramp(){return Math.min(1,G.t/75);} // full pressure at 75s
function bullet(x,y,vx,vy,r,kind){G.bullets.push({x,y,vx,vy,r:r||7,k:kind||'n',gz:false});}
function spAimed(){ // aimed shot from a random edge at ship
 const side=Math.floor(Math.random()*4);let x,y;
 if(side===0){x=Math.random()*W;y=-20;}else if(side===1){x=Math.random()*W;y=H+20;}
 else if(side===2){x=-20;y=Math.random()*H;}else{x=W+20;y=Math.random()*H;}
 const dx=G.px-x,dy=G.py-y,d=Math.hypot(dx,dy)||1,s=120+130*ramp();
 bullet(x,y,dx/d*s,dy/d*s,7,'a');}
function spRing(){ // ring burst from a spot away from the ship (no face-hug spawns)
 let cx,cy,tries=0;
 do{cx=60+Math.random()*(W-120);cy=100+Math.random()*(H-260);tries++;}
 while(Math.hypot(cx-G.px,cy-G.py)<150&&tries<12);
 const n=10+Math.floor(8*ramp()),s=70+70*ramp(),off=Math.random()*6.28;
 for(let i=0;i<n;i++){const a=off+i*6.283/n;bullet(cx,cy,Math.cos(a)*s,Math.sin(a)*s,6,'r');}}
function spWall(){ // wall from top with a gap; gap drifts with depth
 const gapY=120+Math.random()*(H-320),gapH=Math.max(120,190-70*ramp());
 const s=95+75*ramp(),n=14;
 for(let i=0;i<n;i++){const y=i*(H/n)+H/n/2;
  if(Math.abs(y-gapY)<gapH/2)continue;bullet(-14,y,s,0,8,'w');}}
function spawnTick(dt){G.spawnT-=dt;
 if(G.spawnT<=0){G.patternT-=1;
  if(G.patternT<=0){G.ptn=(G.ptn+1+Math.floor(Math.random()*2))%3;G.patternT=3+Math.random()*2;}
  if(G.ptn===0){spAimed();if(ramp()>0.35&&Math.random()<0.5)spAimed();}
  else if(G.ptn===1){if(!G._rlock){spRing();G._rlock=1;setTimeout(()=>G._rlock=0,900);}}
  else{if(!G._wlock){spWall();G._wlock=1;setTimeout(()=>G._wlock=0,1400);}}
  G.spawnT=Math.max(0.16,0.75-0.55*ramp());}}

// ---------- update ----------
let shake=0,last=0;
function update(dt){G.t+=dt;
 // ship: critically damped spring toward target (1:1 drag, no wobble)
 G.vx+=((G.tx-G.px)*80-G.vx*12)*dt;G.px+=G.vx*dt;
 G.vy+=((G.ty-G.py)*80-G.vy*12)*dt;G.py+=G.vy*dt;
 G.px=Math.max(14,Math.min(W-14,G.px));G.py=Math.max(14,Math.min(H-14,G.py));
 spawnTick(dt);
 const gr=GRAZE_R*(G.od>0?1.4:1);
 const comboWin=1.6;
 for(let i=G.bullets.length-1;i>=0;i--){const b=G.bullets[i];
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){G.bullets.splice(i,1);continue;}
  const d=Math.hypot(b.x-G.px,b.y-G.py);
  if(d<HIT_R+b.r){die('hit');return;}
  if(!b.gz&&d<gr+b.r){b.gz=true;G.grazes++;
   if(G.t-G.comboAt<comboWin)G.combo++;else G.combo=1;G.comboAt=G.t;
   G.mult=1+Math.min(7,Math.floor(G.combo/4));
   let pts=5*G.mult*(G.od>0?2:1);G.score+=pts;
   burst((b.x+G.px)/2,(b.y+G.py)/2,3,G.od>0?'#ffd23f':'#7df9ff');
   if(G.grazes>=G.odCount*30+30){G.odCount++;G.od=4;
    G.rings.push({x:G.px,y:G.py,r:10,a:1});sfx('od');}
   else sfx('gz');}
 }
 if(G.t-G.comboAt>comboWin&&G.combo>0){G.combo=0;G.mult=1;}
 if(G.od>0)G.od-=dt;
 // particles
 for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.a-=dt*2.2;if(p.a<=0)G.parts.splice(i,1);}
 for(let i=G.rings.length-1;i>=0;i--){const r=G.rings[i];r.r+=420*dt;r.a-=dt*2.5;if(r.a<=0)G.rings.splice(i,1);}
 if(shake>0)shake=Math.max(0,shake-60*dt);}

function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*160;
 G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,a:0.6+Math.random()*0.5,col:col||'#fff'});}}

// ---------- render ----------
function render(){ctx.save();
 if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
 ctx.fillStyle='#07080f';ctx.fillRect(-20,-20,W+40,H+40);
 // grid stars
 ctx.fillStyle='#141a2e';for(let i=0;i<40;i++){const x=(i*137.5)%W,y=(i*89.3+G.t*30*(1+i%3))%H;
  ctx.fillRect(x,y,2,2);}
 // bullets
 for(const b of G.bullets){const d=Math.hypot(b.x-G.px,b.y-G.py);
  const gr=GRAZE_R*(G.od>0?1.4:1);
  const hot=!b.gz&&d<gr+b.r;
  ctx.fillStyle=hot?'#ffffff':(b.k==='w'?'#ff9f43':b.k==='r'?'#c084fc':'#ff5c7a');
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();
  if(hot){ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,6.283);ctx.stroke();}}
 // graze ring
 if(G.state==='play'||G.state==='over'){const gr=GRAZE_R*(G.od>0?1.4:1);
  ctx.strokeStyle=G.od>0?'rgba(255,210,63,0.5)':'rgba(125,249,255,0.22)';
  ctx.lineWidth=G.od>0?2.5:1.5;ctx.setLineDash([6,7]);
  ctx.beginPath();ctx.arc(G.px,G.py,gr,G.t*(G.od>0?2.4:0.8),G.t*(G.od>0?2.4:0.8)+6.283);ctx.stroke();
  ctx.setLineDash([]);}
 // particles
 for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.col;
  ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;
 // rings
 for(const r of G.rings){ctx.globalAlpha=Math.max(0,r.a);ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();}ctx.globalAlpha=1;
 // ship (triangle)
 if(G.state!=='menu'){ctx.save();ctx.translate(G.px,G.py);
  const a=Math.atan2(G.ty-G.py,G.tx-G.px);ctx.rotate(a);
  ctx.fillStyle=G.od>0?'#ffd23f':'#e8ecff';
  ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-9);ctx.lineTo(-5,0);ctx.lineTo(-10,9);ctx.closePath();ctx.fill();
  ctx.restore();}
 // HUD
 ctx.textAlign='left';ctx.fillStyle='#e8ecff';ctx.font='bold 30px monospace';
 ctx.fillText(String(G.score),16,44);
 ctx.font='13px monospace';ctx.fillStyle='#7a86b8';
 ctx.fillText('BEST '+G.best,16,66);
 if(G.mult>1){ctx.fillStyle=G.od>0?'#ffd23f':'#7df9ff';ctx.font='bold 22px monospace';
  ctx.fillText('x'+G.mult+'  combo '+G.combo,16,96);}
 if(G.od>0){ctx.fillStyle='#ffd23f';ctx.font='bold 16px monospace';
  ctx.fillText('OVERDRIVE '+G.od.toFixed(1)+'s',W-190,44);}
 if(G.state==='play'&&G.t<3){ctx.textAlign='center';ctx.fillStyle='#7a86b8';ctx.font='15px monospace';
  ctx.fillText('skim the edge of bullets — don\'t touch',W/2,H-60);}
 // over/menu overlays
 if(G.state==='over'){ctx.fillStyle='rgba(7,8,15,0.55)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#ff4d6d';ctx.font='bold 44px monospace';
  ctx.fillText('TOUCHED',W/2,H/2-70);
  ctx.fillStyle='#e8ecff';ctx.font='bold 34px monospace';ctx.fillText(String(G.score),W/2,H/2-20);
  ctx.fillStyle='#ffd23f';ctx.font='16px monospace';
  ctx.fillText('grazes '+G.grazes+'  ·  best '+G.best,W/2,H/2+14);
  ctx.fillStyle='#7a86b8';ctx.font='15px monospace';
  ctx.fillText('tap to fly again',W/2,H/2+56);}
 if(G.state==='menu'){ctx.textAlign='center';ctx.fillStyle='#e8ecff';ctx.font='bold 52px monospace';
  ctx.fillText('GRAZER',W/2,H/2-60);
  ctx.fillStyle='#7df9ff';ctx.font='16px monospace';
  ctx.fillText('drag to fly · graze for glory',W/2,H/2-16);
  ctx.fillStyle='#7a86b8';ctx.font='15px monospace';
  ctx.fillText('touch a bullet = death',W/2,H/2+16);
  ctx.fillStyle='#ffd23f';ctx.font='bold 18px monospace';
  ctx.fillText('tap to start',W/2,H/2+70);}
 ctx.restore();}

function loop(ts){requestAnimationFrame(loop);
 const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
 try{if(G.state==='play')update(dt);render();
  if(window.__AUTOTEST)document.title='st='+G.state+' sc='+G.score+' gz='+G.grazes+' cb='+G.combo+' n='+G.bullets.length+' t='+G.t.toFixed(0)+' run='+G.run+' d='+JSON.stringify(G.deaths);}
 catch(e){window.__ERR=e.stack;}}
requestAnimationFrame(loop);
// ---------- webaudio sfx (synthesized, no files) ----------
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay){try{const a=ac(),t=a.currentTime+(delay||0);
 const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
 g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sfx(kind){
 if(kind==='gz'){const p=Math.min(12,G.combo);tone(600+70*p,900+90*p,0.07,'triangle',0.05);}
 else if(kind==='od'){tone(300,1200,0.35,'sawtooth',0.09);tone(600,1800,0.35,'sine',0.05,0.05);}
 else if(kind==='die'){tone(400,40,0.5,'sawtooth',0.12);tone(200,30,0.6,'square',0.08,0.03);}}

// ---------- autotest bots (?autotest=graze|suicide) ----------
function autotest(){window.__AUTOTEST=1;
 const mode=new URLSearchParams(location.search).get('autotest');
 setInterval(()=>{ // drive loop deterministically even under virtual time
  if(G.state==='play'){ // ship stays near last target; bots set targets
   if(mode==='suicide'){ // dive at nearest bullet
    let bn=null,bd=1e9;for(const b of G.bullets){const d=Math.hypot(b.x-G.px,b.y-G.py);if(d<bd){bd=d;bn=b;}}
    if(bn){G.tx=bn.x;G.ty=bn.y;}}
   else{ // graze bot: repulsion from near bullets + center pull + mild bullet lure
    let rx=0,ry=0,bn=null,bd=1e9;
    for(const b of G.bullets){const dx=G.px-b.x,dy=G.py-b.y,d=Math.hypot(dx,dy)||1;
     if(d<bd){bd=d;bn=b;}
     if(d<130){const w=(130-d)*(130-d)/16900;rx+=dx/d*w;ry+=dy/d*w;}}
    if(bn&&bd>70&&bd<160){const a=Math.atan2(bn.y-G.py,bn.x-G.px);
     rx+=Math.cos(a)*0.55;ry+=Math.sin(a)*0.55;} // step closer to graze
    const ca=Math.atan2(H/2-G.py,W/2-G.px);rx+=Math.cos(ca)*0.35;ry+=Math.sin(ca)*0.35;
    if(Math.hypot(rx,ry)<0.12){const a=G.t*1.7;rx=Math.cos(a);ry=Math.sin(a);}
    const m=Math.hypot(rx,ry)||1;
    G.tx=Math.max(24,Math.min(W-24,G.px+rx/m*90));
    G.ty=Math.max(24,Math.min(H-24,G.py+ry/m*90));}
  }},50);
 setInterval(()=>{ // start / restart after death
  if(G.state==='menu'||(G.state==='over'&&performance.now()-G.overAt>450))
   G.tx=G.px,G.ty=G.py,cvtap();
 },120);}
function cvtap(){const r=cv.getBoundingClientRect();
 cv.dispatchEvent(new MouseEvent('mousedown',{clientX:r.left+G.tx,clientY:r.top+G.ty,bubbles:true}));}
if(new URLSearchParams(location.search).get('autotest'))autotest();
</script>
</body>
</html>
