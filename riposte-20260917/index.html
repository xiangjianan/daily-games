<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RIPPOSTE — swipe to deflect</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚔️</text></svg>">
<style>
  html,body{margin:0;padding:0;background:#07080f;height:100%;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  canvas{background:#07080f;touch-action:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
"use strict";
/* RIPPOSTE — swipe to deflect bullets back at enemies. One hit = death. */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 480, H = 800;
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.width = W; cv.height = H;
  cv.style.width = (W*s)+"px"; cv.style.height = (H*s)+"px";
}
window.addEventListener("resize", fit); fit();

/* ---------- audio (WebAudio synth, no files) ---------- */
let AC = null, muted = false;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, vol, slide){
  const a = ac(); if(!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||"square"; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}
function noiseBurst(dur, vol){
  const a = ac(); if(!a || muted) return;
  const n = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol||0.1;
  const f = a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
const SFX = {
  slash(){ noiseBurst(0.09, 0.10); },
  reflect(){ beep(520, 0.10, "square", 0.11, 1040); },
  kill(){ beep(300, 0.16, "triangle", 0.14, 90); },
  combo(n){ beep(400+n*120, 0.08, "square", 0.10, 400+n*120+180); },
  death(){ beep(180, 0.5, "sawtooth", 0.16, 40); noiseBurst(0.3, 0.12); },
  rush(){ beep(140, 0.18, "sawtooth", 0.07, 90); }
};

/* ---------- state ---------- */
const CX = W/2, CY = 430;
let state = "menu";           // menu | play | dead
let score = 0, best = +(localStorage.getItem("rip_best")||0), bestCombo = 1;
let t = 0;                    // run time (s)
let combo = 0, comboT = 0;    // chain window
let shake = 0, hitStop = 0, flash = 0;
let enemies = [], bullets = [], parts = [], floats = [];
let slash = null;             // {x1,y1,x2,y2,age}
let spawnT = 0;
const SLASH_AGE = 0.22, SLASH_HALF = 46, CORE_R = 16;

function reset(){
  score = 0; t = 0; combo = 0; comboT = 0; shake = 0; hitStop = 0; flash = 0;
  enemies = []; bullets = []; parts = []; floats = []; slash = null; spawnT = 0.6;
}

/* ---------- difficulty curve ---------- */
function diff(){
  const m = Math.min(1, t/120);                        // 2 min to max
  return {
    spawn: 1.8 - 1.25*m,                               // 1.8s -> 0.55s
    bullet: 130 + 170*m,                               // 130 -> 300 px/s
    rusherP: Math.min(0.35, 0.10 + 0.25*Math.max(0,(t-25)/95)),
    wander: 40 + 60*m,
    fire: 2.6 - 1.2*m
  };
}

/* ---------- spawning ---------- */
function spawnEnemy(){
  const d = diff(), side = Math.floor(Math.random()*4);
  let x, y, m = 46;
  if(side===0){ x = Math.random()*W; y = -m; }
  else if(side===1){ x = W+m; y = Math.random()*H*0.55; }
  else if(side===2){ x = Math.random()*W; y = H+m; }
  else { x = -m; y = Math.random()*H*0.55; }
  if(Math.hypot(x-CX, y-CY) < 170){ return; }          // never spawn in player's face
  const rush = Math.random() < d.rusherP && enemies.length > 1;
  enemies.push({
    x, y, hp: 2, r: rush ? 13 : 17, rush,
    vx: 0, vy: 0, fireT: 1.2 + Math.random()*1.4,
    wa: Math.random()*Math.PI*2, born: t
  });
}
function spawnBullet(e){
  const d = diff();
  const a = Math.atan2(CY-e.y, CX-e.x) + (Math.random()-0.5)*0.14;
  bullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*d.bullet, vy:Math.sin(a)*d.bullet, r:7, refl:false });
  beep(920, 0.05, "sine", 0.045, 620);
}

/* ---------- particles ---------- */
function burst(x, y, n, col, sp){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (sp||140)*(0.35+Math.random());
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.45+Math.random()*0.3,col});
  }
}
function floatTxt(x, y, s, col){ floats.push({x,y,s,col,life:0.8}); }

/* ---------- slash (swipe) ---------- */
function trySlash(x1,y1,x2,y2){
  if(state!=="play") return;
  const len = Math.hypot(x2-x1, y2-y1);
  if(len < 26) return;                                  // too short = tap, ignore
  // clamp chord to a ring around the core (the sword lives near the sentinel)
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = mx-CX, dy = my-CY, dist = Math.hypot(dx,dy), MAXR = 150;
  if(dist > MAXR){ x1 += (MAXR-dist<1e9? (dx/dist*(dist-MAXR)):0); y1 += dy/dist*(dist-MAXR); x2 = x1 + (x2-x1)*0.6; y2 = y1 + (y2-y1)*0.6; }
  slash = { x1, y1, x2, y2, age: 0 };
  SFX.slash();
  // 1) bullets within capsule get reflected back at nearest enemy
  const sdx = x2-x1, sdy = y2-y1, L2 = sdx*sdx+sdy*sdy || 1;
  for(const b of bullets){
    if(b.refl) continue;
    let u = ((b.x-x1)*sdx + (b.y-y1)*sdy)/L2; u = Math.max(0, Math.min(1, u));
    const px = x1+u*sdx, py = y1+u*sdy;
    if(Math.hypot(b.x-px, b.y-py) < SLASH_HALF + b.r){
      // reflect: reverse + speed boost, aimed loosely at nearest enemy
      let tgt = null, bd = 1e9;
      for(const e of enemies){ const dd = Math.hypot(e.x-b.x, e.y-b.y); if(dd<bd){ bd=dd; tgt=e; } }
      const sp = Math.hypot(b.vx,b.vy)*1.7 + 60;
      let a = tgt ? Math.atan2(tgt.y-b.y, tgt.x-b.x) : Math.atan2(-(b.vy), -(b.vx));
      a += (Math.random()-0.5)*0.12;
      b.vx = Math.cos(a)*sp; b.vy = Math.sin(a)*sp; b.refl = true; b.r = 9;
      SFX.reflect(); burst(b.x, b.y, 10, "#7df9ff", 190); shake = Math.max(shake, 3);
    }
  }
  // 2) enemies whose body crosses the capsule take 1 damage (rushers die in 1)
  for(const e of enemies){
    let u = ((e.x-x1)*sdx + (e.y-y1)*sdy)/L2; u = Math.max(0, Math.min(1, u));
    const px = x1+u*sdx, py = y1+u*sdy;
    if(Math.hypot(e.x-px, e.y-py) < SLASH_HALF + e.r){
      e.hp -= 1; e.hitT = 0.15;
      burst(e.x, e.y, 6, "#ffd166", 130);
      if(e.hp <= 0) killEnemy(e, e.x, e.y);
    }
  }
}
function killEnemy(e, kx, ky){
  const i = enemies.indexOf(e); if(i<0) return;
  enemies.splice(i,1);
  combo = comboT > 0 ? Math.min(combo+1, 5) : 1;
  comboT = 2.0;
  if(combo > bestCombo) bestCombo = combo;
  const gain = 10 * combo;
  score += gain;
  SFX.kill(); if(combo > 1) SFX.combo(combo);
  burst(kx, ky, 22, e.rush ? "#ff6b8a" : "#b18cff", 210);
  floatTxt(kx, ky, "+"+gain + (combo>1 ? " ×"+combo : ""), combo>1 ? "#ffd166" : "#fff");
  hitStop = 0.045; shake = Math.max(shake, 5);
}
function die(cause){
  state = "dead";
  SFX.death();
  shake = 14; flash = 0.5;
  burst(CX, CY, 46, "#ff5d5d", 300);
  if(score > best){ best = score; localStorage.setItem("rip_best", best); }
  if(combo > bestCombo) bestCombo = combo;
}

/* ---------- input (mouse + touch unified) ---------- */
let pDown = false, pX = 0, pY = 0, pT = 0, pMoved = false;
function toCanvas(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return { x: (clientX-r.left)/r.width*W, y: (clientY-r.top)/r.height*H };
}
function down(x, y){
  ac(); if(AC && AC.state === "suspended") AC.resume();
  if(state === "menu"){ state = "play"; reset(); return; }
  if(state === "dead"){ if(t > 0.45){ state = "play"; reset(); } return; }
  pDown = true; pMoved = false; pX = x; pY = y; pT = performance.now();
}
function move(x, y){
  if(!pDown || state !== "play") return;
  if(Math.hypot(x-pX, y-pY) > 26){
    trySlash(pX, pY, x, y);
    pDown = false; pMoved = true;
  }
}
function up(){ pDown = false; }
cv.addEventListener("mousedown", e=>{ const p=toCanvas(e.clientX,e.clientY); down(p.x,p.y); });
window.addEventListener("mousemove", e=>{ const p=toCanvas(e.clientX,e.clientY); move(p.x,p.y); });
window.addEventListener("mouseup", up);
cv.addEventListener("touchstart", e=>{ e.preventDefault(); const p=toCanvas(e.touches[0].clientX,e.touches[0].clientY); down(p.x,p.y); }, {passive:false});
cv.addEventListener("touchmove", e=>{ e.preventDefault(); const p=toCanvas(e.touches[0].clientX,e.touches[0].clientY); move(p.x,p.y); }, {passive:false});
cv.addEventListener("touchend", e=>{ e.preventDefault(); up(); }, {passive:false});

/* ---------- update ---------- */
function update(dt){
  if(state !== "play"){
    t += dt; // menu/dead timers for input gating
    return;
  }
  if(hitStop > 0){ hitStop -= dt; dt *= 0.15; }
  t += dt;
  if(comboT > 0){ comboT -= dt; if(comboT <= 0) combo = 0; }
  if(slash){ slash.age += dt; if(slash.age > SLASH_AGE) slash = null; }
  if(shake > 0) shake = Math.max(0, shake - dt*30);
  if(flash > 0) flash = Math.max(0, flash - dt*2);

  // spawn
  const d = diff();
  spawnT -= dt;
  if(spawnT <= 0){
    spawnEnemy();
    spawnT = d.spawn * (0.75 + Math.random()*0.5);
  }

  // enemies
  for(const e of enemies){
    if(e.hitT) e.hitT = Math.max(0, e.hitT - dt);
    if(e.rush){
      const a = Math.atan2(CY-e.y, CX-e.x);
      e.vx += Math.cos(a)*220*dt; e.vy += Math.sin(a)*220*dt;
      const sp = Math.hypot(e.vx,e.vy), max = 120 + 130*d.rusherP;
      if(sp > max){ e.vx *= max/sp; e.vy *= max/sp; }
      e.x += e.vx*dt; e.y += e.vy*dt;
    } else {
      e.wa += (Math.random()-0.5)*2.4*dt;
      e.x += Math.cos(e.wa)*d.wander*dt;
      e.y += Math.sin(e.wa)*d.wander*dt;
      // stay near edges-ish, drift back if too close to core
      const dc = Math.hypot(e.x-CX, e.y-CY);
      if(dc < 200){ e.x += (e.x-CX)/dc*90*dt; e.y += (e.y-CY)/dc*90*dt; }
      e.x = Math.max(24, Math.min(W-24, e.x)); e.y = Math.max(24, Math.min(H-24, e.y));
      e.fireT -= dt;
      if(e.fireT <= 0 && t - e.born > 0.8){ spawnBullet(e); e.fireT = d.fire*(0.7+Math.random()*0.6); }
    }
    if(Math.hypot(e.x-CX, e.y-CY) < e.r + CORE_R){ die("core"); return; }
  }

  // bullets
  for(let i=bullets.length-1; i>=0; i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.x < -30 || b.x > W+30 || b.y < -30 || b.y > H+30){ bullets.splice(i,1); continue; }
    if(!b.refl && Math.hypot(b.x-CX, b.y-CY) < b.r + CORE_R){ die("bullet"); return; }
    if(b.refl){
      let hit = null;
      for(const e of enemies){ if(Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r){ hit = e; break; } }
      if(hit){ killEnemy(hit, b.x, b.y); bullets.splice(i,1); continue; }
    }
  }

  // particles & floats
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.92; p.vy *= 0.92;
    if(p.life <= 0) parts.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){ floats[i].life -= dt; floats[i].y -= 34*dt; if(floats[i].life<=0) floats.splice(i,1); }
}

/* ---------- draw ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#07080f"; ctx.fillRect(0,0,W,H);
  const sx = (Math.random()-0.5)*shake*2, sy = (Math.random()-0.5)*shake*2;
  ctx.setTransform(1,0,0,1,sx,sy);

  // faint grid
  ctx.strokeStyle = "rgba(120,130,200,0.05)"; ctx.lineWidth = 1;
  for(let x=40;x<W;x+=55){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=40;y<H;y+=55){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // slash zone ring
  ctx.strokeStyle = "rgba(125,249,255,0.10)"; ctx.setLineDash([6,10]);
  ctx.beginPath(); ctx.arc(CX, CY, 150, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);

  // particles
  for(const p of parts){
    ctx.globalAlpha = Math.max(0, p.life*2);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x-2.5, p.y-2.5, 5, 5);
  }
  ctx.globalAlpha = 1;

  // enemies
  for(const e of enemies){
    ctx.save(); ctx.translate(e.x, e.y);
    const wob = Math.sin(t*6 + e.born*7)*0.15;
    ctx.rotate(wob);
    const hitF = e.hitT ? 1 : 0;
    if(e.rush){
      ctx.fillStyle = hitF ? "#fff" : "#ff6b8a";
      ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(11,11); ctx.lineTo(0,5); ctx.lineTo(-11,11); ctx.closePath(); ctx.fill();
      // aim line
      const a = Math.atan2(CY-e.y, CX-e.x);
      ctx.strokeStyle = "rgba(255,107,138,0.25)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*70, Math.sin(a)*70); ctx.stroke();
    } else {
      ctx.fillStyle = hitF ? "#fff" : "#b18cff";
      ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#07080f"; ctx.beginPath(); ctx.arc(0,0,e.r*0.45,0,Math.PI*2); ctx.fill();
      // fire charge tell
      if(e.fireT < 0.45){
        ctx.strokeStyle = "rgba(255,209,102,"+(0.9*(1-e.fireT/0.45))+")"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0,0,e.r+6+e.fireT*18,0,Math.PI*2); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // bullets
  for(const b of bullets){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = b.refl ? "#7df9ff" : "#ff9f43"; ctx.fill();
    if(b.refl){
      ctx.strokeStyle = "rgba(125,249,255,0.5)"; ctx.lineWidth = 2;
      const a = Math.atan2(b.vy,b.vx);
      ctx.beginPath(); ctx.moveTo(b.x-Math.cos(a)*14, b.y-Math.sin(a)*14); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  // slash arc
  if(slash){
    const k = 1 - slash.age/SLASH_AGE;
    ctx.globalAlpha = k;
    ctx.strokeStyle = "#e8f6ff"; ctx.lineWidth = 7*k + 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(slash.x1, slash.y1); ctx.lineTo(slash.x2, slash.y2); ctx.stroke();
    ctx.strokeStyle = "rgba(125,249,255,0.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(slash.x1, slash.y1); ctx.lineTo(slash.x2, slash.y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // core
  const pulse = 1 + Math.sin(t*4)*0.06;
  ctx.fillStyle = "#7df9ff";
  ctx.shadowColor = "#7df9ff"; ctx.shadowBlur = 22;
  ctx.beginPath(); ctx.arc(CX, CY, CORE_R*pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#07080f";
  ctx.beginPath(); ctx.arc(CX, CY, CORE_R*0.4*pulse, 0, Math.PI*2); ctx.fill();

  // combo meter
  if(combo > 1 && comboT > 0){
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 30px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.globalAlpha = Math.min(1, comboT);
    ctx.fillText("×"+combo, CX, 120);
    ctx.globalAlpha = 1;
    // window bar
    ctx.fillStyle = "rgba(255,209,102,0.6)";
    ctx.fillRect(CX-30, 130, 60*(comboT/2), 3);
  }

  // floating texts
  ctx.font = "bold 17px system-ui, sans-serif"; ctx.textAlign = "center";
  for(const f of floats){
    ctx.globalAlpha = Math.min(1, f.life*1.6);
    ctx.fillStyle = f.col; ctx.fillText(f.s, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // HUD
  if(state !== "menu"){
    ctx.fillStyle = "#e8f6ff"; ctx.font = "bold 26px system-ui, sans-serif"; ctx.textAlign = "left";
    ctx.fillText(String(score).padStart(5,"0"), 18, 40);
    ctx.fillStyle = "rgba(232,246,255,0.55)"; ctx.font = "14px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("BEST "+best, W-18, 36);
  }
  if(muted){
    ctx.fillStyle = "rgba(232,246,255,0.4)"; ctx.font = "13px system-ui, sans-serif"; ctx.textAlign = "right";
    ctx.fillText("🔇 muted", W-18, H-14);
  }

  // overlays
  if(flash > 0){ ctx.fillStyle = "rgba(255,60,60,"+(flash*0.35)+")"; ctx.fillRect(0,0,W,H); }

  if(state === "menu" || state === "dead") overlay();
  ctx.setTransform(1,0,0,1,0,0);
}
function overlay(){
  ctx.fillStyle = "rgba(4,5,10,0.62)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign = "center";
  if(state === "menu"){
    ctx.fillStyle = "#e8f6ff"; ctx.font = "bold 52px system-ui, sans-serif";
    ctx.fillText("RIPPOSTE", CX, 300);
    ctx.fillStyle = "#7df9ff"; ctx.font = "17px system-ui, sans-serif";
    ctx.fillText("swipe to deflect · bullets kill your foes", CX, 345);
    ctx.fillStyle = "rgba(232,246,255,0.75)"; ctx.font = "15px system-ui, sans-serif";
    ctx.fillText("swipe anywhere near the core —", CX, 430);
    ctx.fillText("caught bullets fly back, boosted ×1.7", CX, 452);
    ctx.fillText("rushers (🔺) dive in — slash them first", CX, 474);
    ctx.fillText("one hit ends the run", CX, 496);
    const bl = Math.sin(t*4)*0.5+0.5;
    ctx.globalAlpha = 0.5+bl*0.5;
    ctx.fillStyle = "#ffd166"; ctx.font = "bold 19px system-ui, sans-serif";
    ctx.fillText("TAP TO START", CX, 580);
    ctx.globalAlpha = 1;
    if(best > 0){ ctx.fillStyle = "rgba(232,246,255,0.5)"; ctx.font = "14px system-ui, sans-serif"; ctx.fillText("best "+best, CX, 620); }
  } else {
    ctx.fillStyle = "#ff6b8a"; ctx.font = "bold 42px system-ui, sans-serif";
    ctx.fillText("CORE DOWN", CX, 330);
    ctx.fillStyle = "#e8f6ff"; ctx.font = "bold 30px system-ui, sans-serif";
    ctx.fillText(String(score), CX, 390);
    ctx.fillStyle = "rgba(232,246,255,0.6)"; ctx.font = "15px system-ui, sans-serif";
    let line = "best "+best;
    if(score >= best && score > 0) line = "★ NEW BEST "+best;
    if(bestCombo > 1) line += "   ·   top ×"+bestCombo;
    ctx.fillText(line, CX, 424);
    const bl = Math.sin(t*5)*0.5+0.5;
    ctx.globalAlpha = 0.4+bl*0.6;
    ctx.fillStyle = "#7df9ff"; ctx.font = "bold 19px system-ui, sans-serif";
    ctx.fillText("TAP TO RETRY", CX, 560);
    ctx.globalAlpha = 1;
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function loop(now){
  let dt = Math.min(0.05, (now-last)/1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
if(location.search.includes("autotest")){
  // headless-friendly driver: setInterval instead of rAF (virtual time quirk)
  setInterval(()=>loop(performance.now()), 16);
  let mx = 0;
  setInterval(()=>{
    mx++;
    document.title = "st="+state+" sc="+score+" en="+enemies.length+" bl="+bullets.length+
      " t="+t.toFixed(1)+" k="+(window.__kills||0)+" c="+(window.__causes||"")+" f="+mx;
  }, 200);
  // demo bot: circle-swipe around core every ~1.1s to deflect
  window.__kills = 0;
  const origKill = killEnemy;
  killEnemy = function(e,kx,ky){ window.__kills++; return origKill(e,kx,ky); };
  window.__causes = "";
  const origDie = die;
  die = function(c){ window.__causes += c+","; return origDie(c); };
  state = "play"; reset();
  setInterval(()=>{
    if(state !== "play") { if(state==="dead"){ setTimeout(()=>{ if(state==="dead"){ state="play"; reset(); } }, 600); } return; }
    const a = Math.random()*Math.PI*2, R = 95;
    const x1 = CX+Math.cos(a)*R, y1 = CY+Math.sin(a)*R;
    const x2 = CX+Math.cos(a+1.5)*R, y2 = CY+Math.sin(a+1.5)*R;
    trySlash(x1,y1,x2,y2);
  }, 1100);
} else {
  requestAnimationFrame(loop);
}
</script>
</body>
